# Cloudflare Worker that wakes the GitHub Actions bot (see worker.js). Deployed by .github/workflows/relay.yml.
name = "cavi-music-relay"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true  # public URL for the site's ad statistics
preview_urls = false

[triggers]
crons = ["* * * * *"]

[vars]
REPO = "sultonmusic/Spotify"
BRANCH = "ccr-804fe7ec-qgezod"
WORKFLOW = "station.yml"

[[durable_objects.bindings]]
name = "ADSTATS"
class_name = "AdStats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AdStats"]

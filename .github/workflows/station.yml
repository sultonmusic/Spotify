name: Music Station

# Read new Telegram messages -> identify & tag songs -> commit library -> redeploy site.
# The bot keeps running for ~5.5 hours and long-polls Telegram, so it answers right away. Every new song is
# committed and the site redeployed (deploy.yml) while it runs. When it ends it starts the next run by itself;
# the schedule and the relay (relay/, optional) are only fallbacks in case that chain ever breaks.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "web/**"
      - "bot/**"
      - "scripts/**"
      - ".github/workflows/station.yml"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write # the bot starts deploy.yml after each song and the next run when this one ends

concurrency:
  group: music-station
  # A push (new bot/site code) replaces the long-running bot; its library is saved first (always() step).
  # Schedule / dispatch runs wait their turn instead.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  bot:
    name: Telegram bot
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      # Audio files are not needed here: sparse + partial checkout keeps every run fast.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} # the latest library, not the (possibly older) commit that triggered the run
          filter: blob:none
          sparse-checkout: |
            /*
            !/library/audio/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install ffmpeg and fonts
        run: |
          need=""
          command -v ffmpeg >/dev/null || need="ffmpeg"
          [ -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ] || need="$need fonts-dejavu-core"
          [ -z "$need" ] || (sudo apt-get update -qq && sudo apt-get install -y -qq $need)

      - name: Install Python packages
        run: pip install -q -r bot/requirements.txt

      - name: Process Telegram messages
        id: bot
        env:
          LISTEN_SECONDS: ${{ vars.LISTEN_SECONDS || '19800' }}
          MAX_RUNTIME_SECONDS: ${{ vars.MAX_RUNTIME_SECONDS || '19800' }}
          LIVE_PUBLISH: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OWNER_IDS: ${{ secrets.OWNER_IDS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_WEB_SEARCH: ${{ vars.AI_WEB_SEARCH }}
          SHAZAM: ${{ vars.SHAZAM }}
          LYRICS: ${{ vars.LYRICS }}
          AUDIO_STORAGE: ${{ vars.AUDIO_STORAGE }}
          PAGES_AUDIO_LIMIT_MB: ${{ vars.PAGES_AUDIO_LIMIT_MB }}
          PUBLIC_UPLOADS: ${{ vars.PUBLIC_UPLOADS }}
          PUBLIC_DAILY_LIMIT: ${{ vars.PUBLIC_DAILY_LIMIT }}
          PUBLIC_MAX_MB: ${{ vars.PUBLIC_MAX_MB }}
          SITE_URL: ${{ vars.SITE_URL }}
          APP_NAME: ${{ vars.APP_NAME }}
        run: |
          echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
          python -m bot.main

      - name: Save library
        id: save
        if: always()
        run: bash scripts/save-library.sh

      # Keep the bot alive: start the next run (it waits for this one to finish). Skipped when this run
      # ended within 10 minutes, so a broken token can't start an endless loop of runs.
      - name: Start the next run
        if: always() && steps.bot.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ $(( $(date +%s) - ${STARTED:-0} )) -ge 600 ]; then
            gh workflow run station.yml --ref "$GITHUB_REF_NAME" || true
          fi

  deploy:
    name: Deploy website
    needs: bot
    if: >-
      always() &&
      (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch) &&
      (needs.bot.outputs.changed == 'true' || github.event_name != 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pages # one site deployment at a time (the bot also starts deploy.yml while it runs)
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} # includes the commit the bot job just pushed

      - name: Build site
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          APP_NAME: ${{ vars.APP_NAME }}
          FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
        run: bash scripts/build-site.sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

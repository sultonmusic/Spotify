name: Music Station

# Read new Telegram messages -> identify & tag songs -> commit library -> redeploy site.
# Started by the relay (relay/, within a minute of a message) and, as a fallback, by the schedule
# (GitHub often runs "every 5 minutes" schedules only every few hours).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "web/**"
      - "bot/**"
      - "scripts/**"
      - ".github/workflows/station.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: music-station
  cancel-in-progress: false

jobs:
  bot:
    name: Telegram bot
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      # Audio files are not needed here: sparse + partial checkout keeps every run fast.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/library/audio/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install ffmpeg and fonts
        run: |
          need=""
          command -v ffmpeg >/dev/null || need="ffmpeg"
          [ -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ] || need="$need fonts-dejavu-core"
          [ -z "$need" ] || (sudo apt-get update -qq && sudo apt-get install -y -qq $need)

      - name: Install Python packages
        run: pip install -q -r bot/requirements.txt

      - name: Process Telegram messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OWNER_IDS: ${{ secrets.OWNER_IDS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_WEB_SEARCH: ${{ vars.AI_WEB_SEARCH }}
          SHAZAM: ${{ vars.SHAZAM }}
          LYRICS: ${{ vars.LYRICS }}
          LISTEN_SECONDS: ${{ vars.LISTEN_SECONDS }}
          AUDIO_STORAGE: ${{ vars.AUDIO_STORAGE }}
          PAGES_AUDIO_LIMIT_MB: ${{ vars.PAGES_AUDIO_LIMIT_MB }}
          PUBLIC_UPLOADS: ${{ vars.PUBLIC_UPLOADS }}
          SITE_URL: ${{ vars.SITE_URL }}
          APP_NAME: ${{ vars.APP_NAME }}
        run: python -m bot.main

      - name: Save library
        id: save
        if: always()
        run: |
          git config user.name "music-station[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A --sparse library bot/state.json 2>/dev/null || git add -A --sparse library
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "🎵 Library update $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((i * 3))
            git pull -q --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1

  deploy:
    name: Deploy website
    needs: bot
    if: >-
      always() &&
      (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch) &&
      (needs.bot.outputs.changed == 'true' || github.event_name != 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} # includes the commit the bot job just pushed

      - name: Build site
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          APP_NAME: ${{ vars.APP_NAME }}
        run: bash scripts/build-site.sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

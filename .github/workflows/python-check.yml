name: Python validation

on:
  pull_request:
    paths:
      - "bot/**"
      - "scripts/**"
      - ".github/workflows/python-check.yml"
  push:
    branches:
      - "**"
    paths:
      - "bot/**"
      - "scripts/**"
      - ".github/workflows/python-check.yml"

permissions:
  contents: read

jobs:
  syntax:
    name: Python syntax and whitespace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m compileall -q bot scripts
      - name: Check patch whitespace
        run: git diff --check

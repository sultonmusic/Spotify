name: Remove Cavi Bulk Import
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: music-station
  cancel-in-progress: false
jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Remove only the added importer and its documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          readme = Path('README.md')
          section = "Ko'p artist bo'yicha bir buyruq bilan navbatli forward qilish uchun\n[ommaviy import ko'rsatmasi](scripts/BULK_IMPORT.md) va\n`scripts/bulk_import.py` qo'shildi. Dastur egasining alohida Telegram user session'i\nbilan ishlaydi; Cavi botining o'zi internetdan musiqa yuklamaydi.\n\n"
          content = readme.read_text()
          if content.count(section) != 1:
              raise SystemExit('Expected importer README section not found exactly once; no changes made')
          readme.write_text(content.replace(section, '', 1))
          ignore = Path('.gitignore')
          added = {'.cavi-import/', '*.session', '*.session-journal'}
          ignore.write_text(''.join(line for line in ignore.read_text().splitlines(keepends=True) if line.strip() not in added))
          PY
          git rm --ignore-unmatch -- scripts/bulk_import.py scripts/import_artists.txt scripts/test_bulk_import.py scripts/BULK_IMPORT.md .github/workflows/bulk-import.yml .github/workflows/remove-cavi-import.yml
          git add README.md .gitignore
          git config user.name 'music-station[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove unused Telegram bulk importer and workflow'
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

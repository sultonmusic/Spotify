name: Website music upload

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Queued upload ID
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: web-music-${{ github.event.inputs.job_id }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          filter: blob:none
          sparse-checkout: |
            /*
            !/library/audio/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install media tools
        run: |
          need=""
          command -v ffmpeg >/dev/null || need="ffmpeg"
          [ -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ] || need="$need fonts-dejavu-core"
          [ -z "$need" ] || (sudo apt-get update -qq && sudo apt-get install -y -qq $need)

      - name: Install Python packages
        run: pip install -q -r bot/requirements.txt

      - name: Process website upload
        id: process
        env:
          WEB_MUSIC_API_URL: https://cavi-music-relay.sales-infarmatik-tj.workers.dev
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OWNER_IDS: ${{ secrets.OWNER_IDS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_WEB_SEARCH: ${{ vars.AI_WEB_SEARCH }}
          SHAZAM: ${{ vars.SHAZAM }}
          LYRICS: ${{ vars.LYRICS }}
          AUDIO_STORAGE: ${{ vars.AUDIO_STORAGE }}
          PAGES_AUDIO_LIMIT_MB: ${{ vars.PAGES_AUDIO_LIMIT_MB }}
          SITE_URL: ${{ vars.SITE_URL }}
          APP_NAME: ${{ vars.APP_NAME }}
          JOB_ID: ${{ inputs.job_id }}
        run: python scripts/web_music_job.py --job-id "$JOB_ID" --result "$RUNNER_TEMP/web-music-result.json"

      - name: Save the updated library
        id: save
        if: steps.process.outcome == 'success'
        run: |
          git config user.name "music-station[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.library.name "library JSON merge"
          git config merge.library.driver "python3 scripts/merge_json.py %O %A %B"
          git add -A --sparse library bot/state.json 2>/dev/null || git add -A --sparse library
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "🎵 Website upload $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((i * 3))
            git pull -q --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1

      # The processing checkout skips old audio blobs for speed. Deploy from a separate, full checkout so
      # an upload never removes previously published audio from the Pages artifact (re-using the sparse
      # working tree here published the site without library/audio).
      - uses: actions/checkout@v4
        if: steps.save.outputs.changed == 'true'
        with:
          ref: ${{ github.ref_name }}
          path: site-src

      - uses: actions/configure-pages@v5
        if: steps.save.outputs.changed == 'true'

      - name: Build website
        if: steps.save.outputs.changed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          APP_NAME: ${{ vars.APP_NAME }}
          FP_BUDGET_SECONDS: "90" # a listener is waiting: only a few new songs here, the rest in the station's deploy
        run: bash site-src/scripts/build-site.sh "$GITHUB_WORKSPACE/_site"

      - uses: actions/upload-pages-artifact@v3
        if: steps.save.outputs.changed == 'true'
        with:
          path: _site

      # GitHub sometimes reports the just-uploaded Pages artifact as missing: wait and try again.
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.save.outputs.changed == 'true'
        continue-on-error: true

      - name: Wait before retrying the deployment
        if: steps.save.outputs.changed == 'true' && steps.deployment.outcome == 'failure'
        run: sleep 45

      - id: deployment_retry
        if: steps.save.outputs.changed == 'true' && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Report final status
        if: always()
        continue-on-error: true
        env:
          WEB_MUSIC_API_URL: https://cavi-music-relay.sales-infarmatik-tj.workers.dev
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          WORKFLOW_OUTCOME: ${{ job.status }}
          JOB_ID: ${{ inputs.job_id }}
        run: python scripts/web_music_job.py --job-id "$JOB_ID" --result "$RUNNER_TEMP/web-music-result.json" --finalize
